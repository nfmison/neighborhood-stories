<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Historical photographs — Neighborhood Stories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 24px 70px;
      font-family: Arial, sans-serif;
      background: white;
      color: #222;
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .back-link {
      color: #222;
      text-decoration: none;
      font-size: 15px;
    }

    h1 {
      margin: 65px 0 15px;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: normal;
    }

    .introduction {
      max-width: 680px;
      margin-bottom: 70px;
      color: #555;
      line-height: 1.6;
      font-size: 17px;
    }

    .subjects {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 45px;
      flex-wrap: wrap;
    }

    .subject-circle {
      width: 230px;
      height: 230px;
      border: 1px solid #333;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;
      text-align: center;
      text-decoration: none;
      color: #222;

      font-size: 19px;
      line-height: 1.35;

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .subject-circle:hover,
    .subject-circle:focus-visible {
      transform: translateY(-5px);
      background: #f5f5f5;
    }

    .future-circle {
      color: #999;
      border-color: #aaa;
    }

    @media (max-width: 650px) {
      h1 {
        margin-top: 45px;
      }

      .introduction {
        margin-bottom: 45px;
      }

      .subjects {
        gap: 28px;
      }

      .subject-circle {
        width: 190px;
        height: 190px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <a class="back-link" href="index.html">
      ← Neighborhood Stories
    </a>

    <h1>Historical photographs</h1>

    <p class="introduction">
      Historical photographs presented alongside modern photographic
      reconstructions. Select a subject to explore the original images
      and their contemporary interpretations.
    </p>

    <nav class="subjects" aria-label="Historical photograph subjects">

      <a
        class="subject-circle"
        href="hakutsuru-sake-brewery.html"
      >
        Hakutsuru<br>
        Sake Brewery
      </a>

      <a
        class="subject-circle"
        href="hanshin-flood-1938.html"
      >
        The Great<br>
        Hanshin Flood<br>
        of 1938
      </a>

      <div
        class="subject-circle future-circle"
        aria-label="Future historical subject"
      >
        More stories<br>
        to come
      </div>

    </nav>

  </main>

</body>
</html>
